server:
  address: ${CHANGE_ADVISOR_BIND_ADDRESS:127.0.0.1}
  port: 9090
spring:
  application:
    name: change-advisor
  datasource:
    url: ${ADVISOR_DB_URL:jdbc:h2:file:./data/change-advisor}
    username: sa
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB
  mvc:
    problemdetails:
      enabled: true
  sql:
    init:
      mode: always
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    mcp:
      server:
        name: change-advisor
        protocol: STREAMABLE
      client:
        initialized: false
        request-timeout: 8s
        toolcallback:
          enabled: false
        streamable-http:
          connections:
            advisor:
              url: http://127.0.0.1:${server.port}

advisor:
  mcp:
    token: "${ADVISOR_MCP_TOKEN:}"
  accounts:
    biz-password: "${ADVISOR_BIZ_PASSWORD:1234}"
    dev-password: "${ADVISOR_DEV_PASSWORD:1234}"
