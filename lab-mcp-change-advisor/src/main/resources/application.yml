server:
  address: 127.0.0.1
  port: 8091
spring:
  application:
    name: change-advisor
  datasource:
    url: ${ADVISOR_DB_URL:jdbc:h2:file:./data/change-advisor}
    username: sa
  mvc:
    problemdetails:
      enabled: true
  sql:
    init:
      mode: always
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    mcp:
      client:
        initialized: false
        request-timeout: 8s
        toolcallback:
          enabled: false
        streamable-http:
          connections:
            sample:
              url: ${SAMPLE_MCP_URL:http://127.0.0.1:8092}
