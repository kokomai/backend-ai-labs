<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>개발자 문의함 | 변경 요청 센터</title>
  <link rel="stylesheet" href="/advisor.css">
  <script type="module" src="/developer.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">변경 요청 센터</a>
    <nav aria-label="작업 화면">
      <a href="/developer.html" aria-current="page">개발자</a>
      <a href="/logout">로그아웃</a>
    </nav>
  </header>
  <main>
    <h1>개발자 문의함</h1>
    <p class="intro">접수된 변경 요청과 분석 결과를 확인하고 답변을 남기세요.</p>
    <div class="split developer-layout">
      <section class="panel" aria-labelledby="inbox">
        <h2 id="inbox">접수 목록</h2>
        <div id="developer-tickets"></div>
      </section>
      <section class="panel" aria-label="문의 상세">
        <p id="developer-message" role="status"></p>
        <div id="ticket-detail">
          <p class="hint">목록에서 문의를 선택해 주세요.</p>
        </div>
        <div id="ticket-analysis"></div>
        <div id="ticket-action"></div>
      </section>
    </div>
  </main>
</body>
</html>
