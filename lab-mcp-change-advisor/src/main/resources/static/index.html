<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>현업 문의 | 변경 요청 센터</title>
  <link rel="stylesheet" href="/advisor.css">
  <script type="module" src="/business.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">변경 요청 센터</a>
    <nav aria-label="작업 화면">
      <a href="/" aria-current="page">현업</a>
      <a href="/developer.html">개발자</a>
    </nav>
  </header>
  <main>
    <h1>1:1 변경 문의</h1>
    <p class="intro">어떤 화면에서 무엇을 바꾸고 싶은지 알려 주세요.</p>
    <div class="split business-layout">
      <section class="panel" aria-labelledby="new-ticket">
        <h2 id="new-ticket">문의 작성</h2>
        <form id="create-ticket">
          <label for="screen">대상 화면</label>
          <div class="field-row">
            <select id="screen" name="screenPath" required>
              <option value="">화면 선택</option>
              <option value="/contracts.html">계약 조회</option>
              <option value="/quote.html">보험료 계산</option>
            </select>
            <a id="sample-link" href="http://127.0.0.1:8092/" target="_blank" rel="noopener">샘플 앱 열기 ↗</a>
          </div>
          <label>제목<input name="title" maxlength="120" required placeholder="예: 결합 할인율 변경"></label>
          <label>변경 요청
            <textarea name="request" maxlength="3000" rows="6" required
              placeholder="예: 보험료 계산에서 결합 할인을 적용하면 할인율이 15%가 되도록 변경해 주세요."></textarea>
          </label>
          <button class="primary" type="submit">문의 접수</button>
          <p id="form-message" role="status"></p>
        </form>
      </section>
      <section class="panel" aria-labelledby="my-tickets">
        <h2 id="my-tickets">내 문의</h2>
        <p class="hint">이 브라우저에서 접수하거나 문의 링크로 연 내역입니다.</p>
        <div id="business-tickets"></div>
      </section>
    </div>
  </main>
</body>
</html>
